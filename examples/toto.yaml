outro:
  s13_capacity_bullet_en_html: "Accor holds 20,000 on 27 March. Magic opens a space for them, and for the millions who couldn't be there too."
  s13_capacity_bullet_fr_html: "Accor accueillera 20 000 fans le 27 mars. Magic leur ouvre un espace, ainsi qu'aux millions qui n'ont pas pu en être."
  s13_moment_bullet_en_html: "from pre-show anticipation to the final encore and the months after, every fan lives every beat alongside ElGrandeToto, ticket or not."
  s13_moment_bullet_fr_html: "des moments imaginés avant les concerts au dernier rappel puis aux mois qui suivent, chaque fan vit un instant unique avec ElGrandeToto, avec ou sans billet."
