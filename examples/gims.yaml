outro:
  s13_capacity_bullet_en_html: "La Défense Arena holds 40,000. Across two nights on 16–17 December, that's 80,000 fans. Magic opens a space for them, and for the millions who couldn't be there too."
  s13_capacity_bullet_fr_html: "La Défense Arena accueille 40 000 fans. Sur deux soirs, les 16 et 17 décembre, cela représente 80 000 fans. Magic leur ouvre un espace, ainsi qu'aux millions qui n'ont pas pu en être."
  s13_moment_bullet_en_html: "from pre-show anticipation to the final encore and the months after, every fan lives every beat alongside GIMS, ticket or not."
  s13_moment_bullet_fr_html: "des moments imaginés avant les concerts au dernier rappel puis aux mois qui suivent, chaque fan vit un instant unique avec GIMS, avec ou sans billet."
