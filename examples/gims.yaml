# Magic deck profile — GIMS (concert pulse, multi-night, La Défense Arena)
# Renders byte-identical to magic-gims-deck/index.html MODULO the 7 known drift fixes.
# Notably: mirrored hero (Gims-only), single-line s4 centre at 15px, plural ribbon labels.

pulse_type: concert

identity:
  deck_slug: gims
  deck_title: "Magic — GIMS"
  artist_name_display: GIMS
  artist_name_pill: GIMS
  artist_name_pill_lowercase_flag: false
  s4_centre_line1: GIMS
  s4_centre_line2: ""               # Gims is single-line
  s4_centre_line1_size: 15

cover:
  cover_trigger_en: "Built for Carpe Diem tour · La Défense Arena · 16-17 December 2026"
  cover_trigger_fr: "Pensé pour la tournée Carpe Diem · La Défense Arena · 16-17 décembre 2026"

s1:
  s1_trigger_en: "La Défense Arena on 16-17 December is the trigger. Magic is what turns those two nights into a fandom that keeps going."
  s1_trigger_fr: "La Défense Arena les 16 et 17 décembre, c'est le déclencheur. Magic, c'est ce qui transforme ces deux soirs en un fandom qui dure."
  s1_hero_img_src: "Assets/welcome-gims.jpeg"
  s1_hero_img_alt: GIMS
  s1_hero_object_position: "center 30%"
  s1_hero_mirrored: true             # mirrored: transform:scaleX(-1) + mask flips to-left

hero:
  frames_path_prefix: "Assets/Frames/Deck Edits/"
  s_superfans_hero_img_src: "Assets/MMCJUWLHLRCNXL4UAFHPH36IM4.jpg"
  s_superfans_hero_object_position: "center 30%"

s5:
  s5_body_en: "Magic, for real. A range of experiences inside the Fanverse, shaped with your team (chat, treasure hunts, drops, collectibles, and more), keeping GIMS and his fans close every day."
  s5_body_fr: "Magic en vrai. De nombreuses expériences au cœur du Fanverse à développer avec vos équipes (chat, chasse au trésor, drops, collectibles, etc.) rapprochent GIMS et ses fans chaque jour."

momentum:
  momentum_sub_en: "Magic turns the Carpe Diem tour and everything around it into fan experiences that drive more reach, more sales, more engagement. Fewer flat spots, momentum all year."
  momentum_sub_fr: "Magic transforme la tournée Carpe Diem et tout ce qui l'entoure en expériences fans qui génèrent plus de portée, plus de ventes, plus d'engagement. Moins de creux, du momentum toute l'année."
