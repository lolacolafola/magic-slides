outro:
  s13_capacity_bullet_en_html: "Stade de France holds 80,000. Across three nights on 29–31 May, that's 240,000 fans. Magic opens a space for them, and for the millions who couldn't be there too."
  s13_capacity_bullet_fr_html: "Le Stade de France accueille 80 000 fans. Sur trois soirs, les 29, 30 et 31 mai, cela représente 240 000 fans. Magic leur ouvre un espace, ainsi qu'aux millions qui n'ont pas pu en être."
  s13_moment_bullet_en_html: "from pre-show anticipation to the final encore and the months after, every fan lives every beat alongside Aya, ticket or not."
  s13_moment_bullet_fr_html: "des moments imaginés avant les concerts au dernier rappel puis aux mois qui suivent, chaque fan vit un instant unique avec Aya, avec ou sans billet."
