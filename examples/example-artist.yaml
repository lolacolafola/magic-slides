outro:
  s13_capacity_bullet_en_html: "[Venue] holds [capacity] on [date]. Magic opens a space for them, and for the millions who couldn't be there too."
  s13_capacity_bullet_fr_html: "[Venue] accueillera [capacité] fans le [date]. Magic leur ouvre un espace, ainsi qu'aux millions qui n'ont pas pu en être."
  s13_moment_bullet_en_html: "from pre-show anticipation to the final encore and the months after, every fan lives every beat alongside Example Artist, ticket or not."
  s13_moment_bullet_fr_html: "des moments imaginés avant les concerts au dernier rappel puis aux mois qui suivent, chaque fan vit un instant unique avec Example Artist, avec ou sans billet."
