# Magic deck profile — Example Artist (concert pulse, single night).
# Fictional example showing the YAML structure. Real client YAMLs stay local.
# Copy this file, rename to your-artist.yaml, fill in verified facts.

pulse_type: concert

identity:
  deck_slug: example-artist
  deck_title: "Magic — Example Artist"
  artist_name_display: Example Artist
  artist_name_pill: Example Artist
  artist_name_pill_lowercase_flag: false
  s4_centre_line1: EXAMPLE
  s4_centre_line2: ARTIST
  s4_centre_line1_size: 11

cover:
  cover_trigger_en: "Built for [tour name] · [venue] · [date]"
  cover_trigger_fr: "Pensé pour [tournée] · [venue] · [date]"

s1:
  s1_trigger_en: "[Venue] on [date] is the trigger. Magic is what turns one night into a fandom that keeps going."
  s1_trigger_fr: "[Venue] le [date], c'est le déclencheur. Magic, c'est ce qui transforme un soir en un fandom qui dure."
  s1_hero_img_src: "Assets/example-hero.jpg"
  s1_hero_img_alt: Example Artist
  s1_hero_object_position: "center 30%"
  s1_hero_mirrored: false

hero:
        frames_path_prefix: "Assets/Frames/Deck Edits/"
  s_superfans_hero_img_src: "Assets/example-superfans.jpg"
  s_superfans_hero_object_position: "40% 30%"

s5:
  s5_body_en: "Magic, for real. A range of experiences inside the Fanverse, shaped with your team (chat, treasure hunts, drops, collectibles, and more), keeping Example Artist and his fans close every day."
  s5_body_fr: "Magic en vrai. De nombreuses expériences au cœur du Fanverse à développer avec vos équipes (chat, chasse au trésor, drops, collectibles, etc.) rapprochent Example Artist et ses fans chaque jour."

momentum:
  momentum_sub_en: "Magic turns the show and everything around it into fan experiences that drive more reach, more sales, more engagement. Fewer flat spots, momentum all year."
  momentum_sub_fr: "Magic transforme le concert et tout ce qui l'entoure en expériences fans qui génèrent plus de portée, plus de ventes, plus d'engagement. Moins de creux, du momentum toute l'année."
  phase_build_label_en: "Build-up · Sep - Feb"
  phase_build_label_fr: "Mise en route · sep - fév"
  phase_peak_label_en: "Concert · Mar"
  phase_peak_label_fr: "Le concert · mars"
  phase_after_label_en: "After the show · Apr - onwards"
  phase_after_label_fr: "Après le concert · avril - et après"

crm:
  crm_headline_en_html: 'The road to <span class="gt">the show and beyond.</span>'
  crm_headline_fr_html: 'La route vers <span class="gt">le concert, et au-delà.</span>'
  crm_sub_en: "Here's an example of Example Artist's Fanverse in action, from his first stream to the next tour."
  crm_sub_fr: "Voici un exemple du Fanverse d'Example Artist en action, du premier stream à la prochaine tournée."
  crm_months:
    - label: SEPT
      is_peak: false
      cards:
        - nm_en: "Connect &amp; climb"
          nm_fr: "Connect &amp; climb"
          hk_en: "Link Spotify, earn coins per stream"
          hk_fr: "Connecte Spotify, gagne des coins par écoute"
          color: cyan
          rwd: true
          icons: [sparkle]
        - nm_en: "City crew"
          nm_fr: "Équipe de la ville"
          hk_en: "Refer a friend, earn coins when they join"
          hk_fr: "Parraine un ami, gagne des coins quand il rejoint"
          color: cyan
          rwd: true
          icons: [ticket]
    - label: OCT/NOV
      is_peak: false
      cards:
        - nm_en: "City hunt"
          nm_fr: "City hunt"
          hk_en: "Scan QR checkpoints to unlock drops"
          hk_fr: "Scanne les QR pour débloquer des drops"
          color: cyan
          rwd: true
          icons: [sparkle]
        - nm_en: "Match the beat"
          nm_fr: "Match the beat"
          hk_en: "Tap along with his song to test your skills"
          hk_fr: "Tape en rythme avec son morceau pour tester ta précision"
          color: cyan
          rwd: true
          icons: [sparkle]
    - label: DEC
      is_peak: false
      cards:
        - nm_en: "Artist tastes"
          nm_fr: "Les goûts de l'artiste"
          hk_en: "He shares the tracks shaping his sound"
          hk_fr: "Il partage les morceaux qui inspirent son univers"
          color: cyan
          rwd: true
          icons: [sparkle]
    - label: JAN/FEB
      is_peak: false
      cards:
        - nm_en: "Show vote"
          nm_fr: "Vote du show"
          hk_en: "Vote one track the artist plays at the show"
          hk_fr: "Vote un morceau que l'artiste joue au concert"
          color: cyan
          rwd: true
          icons: [sparkle]
        - nm_en: "Golden ticket"
          nm_fr: "Golden ticket"
          hk_en: "Top fans unlock the ticket presale"
          hk_fr: "Les top fans accèdent à la prévente"
          color: cyan
          rwd: false
          icons: [ticket, bag]
    - label: MAR
      is_peak: true
      cards:
        - nm_en: "Final countdown"
          nm_fr: "Compte à rebours"
          hk_en: "Daily drops the week before the show"
          hk_fr: "Drops quotidiens la semaine d&apos;avant le show"
          color: purp
          rwd: false
          icons: [ticket]
        - nm_en: "City challenge"
          nm_fr: "Défi des villes"
          hk_en: "Group selfie at the venue wins a digital collectible"
          hk_fr: "Selfie de groupe au venue = collectible digital"
          color: purp
          rwd: true
          icons: [sparkle]
    - label: MAR
      is_peak: true
      cards:
        - nm_en: "Collect at venue"
          nm_fr: "Retrait au venue"
          hk_en: "Order merch ahead, collect on show night"
          hk_fr: "Commande le merch en avance, récupère le soir J"
          color: purp
          rwd: false
          icons: [bag]
        - nm_en: "Encore unlock"
          nm_fr: "Encore unlock"
          hk_en: "Scan your stub, get a free drink"
          hk_fr: "Scanne ton billet, gagne un verre offert"
          color: purp
          rwd: false
          icons: [bag]
    - label: APR
      is_peak: false
      cards:
        - nm_en: "Backstage pass"
          nm_fr: "Backstage pass"
          hk_en: "Backstage video on Magic Unlimited"
          hk_fr: "Vidéo backstage sur Magic Unlimited"
          color: teal
          rwd: false
          icons: [video]
        - nm_en: "Artist limited"
          nm_fr: "Artist limited"
          hk_en: "Limited drop, link to checkout"
          hk_fr: "Drop limité, lien direct au checkout"
          color: teal
          rwd: false
          icons: [bag]
    - label: MAY
      is_peak: false
      cards:
        - nm_en: "Stream club"
          nm_fr: "Stream club"
          hk_en: "Stream his catalogue, earn coins for every play"
          hk_fr: "Streame son catalogue, gagne des coins à chaque écoute"
          color: teal
          rwd: true
          icons: [spotify]

